<div class="modal">
  <div class="modal__header">
    <h2 class="modal__title">Usuarios Inactivos</h2>
    <button class="modal__close" (click)="closeModal()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="users-grid">
    @for (user of users(); track user.userId) {
    <article class="user-card">
      <div class="card-top">
        <div class="avatar">{{ user.firstName[0] }}{{ user.lastName[0] }}</div>
        <div class="card-meta">
          <h3 class="user-name">{{ user.firstName }} {{ user.lastName }}</h3>
          <span class="role-badge">{{ user.role }}</span>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="user-info">
        <span class="info-row">
          <span class="material-symbols-outlined icon-sm">mail</span>
          <span class="info-text">{{ user.email }}</span>
        </span>
      </div>
      <button class="btn-reactivate" (click)="reactivate(user.userId)">
        <span class="material-symbols-outlined">person_check</span>
        Reactivar
      </button>
    </article>
    } @empty {
    <div class="empty-state">
      <span class="material-symbols-outlined">check_circle</span>
      <p>No hay usuarios inactivos.</p>
    </div>
    }
  </div>
</div>
