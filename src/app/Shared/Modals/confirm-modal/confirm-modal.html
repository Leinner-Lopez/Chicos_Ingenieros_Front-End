<div class="modal">
    <button class="modal__close" (click)="closeModal()">
        <span class="material-symbols-outlined">
            close
        </span>
    </button>
    <h2 class="modal__title">{{title}}</h2>
    <div class="modal__content">
        <h3 class="content__text">{{message}}</h3>
        <div class="content__buttons">
            <button class="buttons__button button--accept" (click)="confirmAction()">{{ 'common.accept' | transloco }}</button>
            <button class="buttons__button button--cancel" (click)="closeModal()">{{ 'common.cancel' | transloco }}</button>
        </div>
    </div>
</div>
