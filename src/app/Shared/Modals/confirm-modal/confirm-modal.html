<div class="modal">
    <button class="modal__close" (click)="closeModal()">
        <span class="material-symbols-outlined">
            close
        </span>
    </button>
    <h2 class="modal__title">Confirmar Eliminación</h2>
    <div class="modal__content">
        <h3 class="content__text">¿Deseas eliminar esta categoría?</h3>
        <div class="content__buttons">
            <button class="buttons__button button--accept" (click)="confirmAction()">Aceptar</button>
            <button class="buttons__button button--cancel" (click)="closeModal()">Cancelar</button>
        </div>
    </div>
</div>
