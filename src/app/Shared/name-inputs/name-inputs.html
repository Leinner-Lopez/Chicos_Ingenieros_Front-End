<div class="input-container">
  <label>{{ 'auth.firstNames' | transloco }}<input type="text" formControlName="names" placeholder="Andres" required /></label>
  @if (hasError('names', 'required')) {
  <p class="error__message">{{ 'validation.required' | transloco }}</p>
  }
</div>
<div class="input-container">
  <label
    >{{ 'auth.lastNames' | transloco }}<input
      type="text"
      formControlName="lastNames"
      placeholder="Torres"
      required
  /></label>
  @if (hasError('lastNames', 'required')) {
  <p class="error__message">{{ 'validation.required' | transloco }}</p>
  }
</div>
