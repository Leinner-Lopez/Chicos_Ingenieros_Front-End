<nav class="navbar" [attr.aria-label]="'menu.sidebarLabel' | transloco">
  <section class="navbar__group">
    <header class="group__user">
      <div class="user__icon">
        <p>Z</p>
      </div>
      <h3 class="user__title">Zenkai</h3>
    </header>

    <ul class="group__list">
      @for (item of menuItems(); track item.route) {
      <li class="list__item">
        <a
          [routerLink]="item.route"
          class="item__link"
          routerLinkActive="router-active"
          [routerLinkActiveOptions]="{exact: true}"
        >
          <span class="material-symbols-outlined">{{item.icon}}</span>
          {{ item.label | transloco }}
        </a>
      </li>
      }
      <button (click)="logout()" class="item__link">
        <span class="material-symbols-outlined">logout</span>
        {{ 'common.logout' | transloco }}
      </button>
      <li class="list__item list__item--lang"><app-language-switcher /></li>
    </ul>
  </section>
</nav>
