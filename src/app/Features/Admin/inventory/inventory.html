<section class="categories__view">
  <header class="view__header">
    <h2 class="header__title">Inventario</h2>
  </header>

  <section class="view__cards">
    <ul class="cards__list">
      <li class="list__item">
        <small class="item__title">Productos Totales</small>
        <strong class="item__content">{{ productCount() }}</strong>
      </li>
      <li class="list__item">
        <small class="item__title">Activas</small>
        <strong class="item__content"></strong>
      </li>
      <li class="list__item">
        <small class="item__title">Inactivas</small>
        <strong class="item__content"></strong>
      </li>
      <li class="list__item">
        <small class="item__title">Sin Productos</small>
        <strong class="item__content"></strong>
      </li>
    </ul>
  </section>

  <table class="view__table">
    <thead class="table__title">
      <tr class="title__row">
        <th class="row__title">Nombre</th>
        <th class="row__title">Stock Minimo</th>
        <th class="row__title">Stock Total</th>
      </tr>
    </thead>
    <tbody class="table__body">
      @for (inventario of inventory(); track inventario.productId) {
      <tr class="body__row">
        <td class="row__content">{{ inventario.name }}</td>
        <td class="row__content">{{ inventario.minStock }}</td>
        <td class="row__content">{{ inventario.totalStock }}</td>
      </tr>
      }
    </tbody>
  </table>
</section>
