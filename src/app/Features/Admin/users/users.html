<section class="users__view">
  <header class="view__header">
    <h2 class="header__title">Usuarios</h2>
    <button class="header__button" (click)="registerUser()">
      <span class="material-symbols-outlined"> add </span>
      Registrar
    </button>
  </header>

  <section class="view__cards">
    <ul class="cards__list">
      <li class="list__item">
        <small class="item__title">Totales</small>
        <strong class="item__content">{{usersNumber()}}</strong>
      </li>
      <li class="list__item">
        <small class="item__title">Activas</small>
        <strong class="item__content"></strong>
      </li>
      <li class="list__item">
        <small class="item__title">Inactivas</small>
        <strong class="item__content"></strong>
      </li>
    </ul>
  </section>

  <table class="view__table">
    <thead class="table__title">
      <tr class="title__row">
        <th class="row__title">Nombre</th>
        <th class="row__title">Apellido</th>
        <th class="row__title">Email</th>
        <th class="row__title">Rol</th>
        <th class="row__title">Acciones</th>
      </tr>
    </thead>
    <tbody class="table__body">
      @for (user of users(); track user.user_id) {
      <tr class="body__row">
        <td class="row__content">{{user.first_name}}</td>
        <td class="row__content">{{user.last_name}}</td>
        <td class="row__content">{{user.email}}</td>
        <td class="row__content">{{user.role}}</td>
        <td class="row__content row__actions">
          <button class="button edit__button" (click)="updateUser(user.user_id)">
            <span class="material-symbols-outlined"> edit </span>
          </button>
          <button class="button delete__button" (click)="deleteUser(user.user_id)">
            <span class="material-symbols-outlined"> delete </span>
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</section>
