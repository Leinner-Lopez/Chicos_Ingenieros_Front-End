<section class="users-view">
  <header class="view-header">
    <div class="header-text">
      <h2 class="header-title">Usuarios</h2>
      <p class="header-subtitle">{{ usersNumber() }} usuarios activos</p>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" (click)="openInactiveUsers()">
        <span class="material-symbols-outlined">person_off</span>
        Inactivos
      </button>
      <button class="btn-primary" (click)="registerUser()">
        <span class="material-symbols-outlined">add</span>
        Registrar
      </button>
    </div>
  </header>

  <div class="bento-grid">
    @for (user of users(); track user.userId) {
    <article class="user-card">
      <div class="card-top">
        <div class="avatar">{{ user.firstName[0] }}{{ user.lastName[0] }}</div>
        <div class="card-meta">
          <h3 class="user-name">{{ user.firstName }} {{ user.lastName }}</h3>
          <span [class]="'role-badge role-'">{{ user.role }}</span>
        </div>
      </div>

      <div class="card-divider"></div>

      <div class="user-info">
        <span class="info-row">
          <span class="material-symbols-outlined icon-sm">mail</span>
          <span class="info-text">{{ user.email }}</span>
        </span>
      </div>

      <div class="card-actions">
        <button class="btn-action btn-edit" (click)="updateUser(user.userId)">
          <span class="material-symbols-outlined">edit</span>
          Editar
        </button>
        <button
          class="btn-action btn-delete"
          (click)="deactivateUser(user.userId)"
          title="Desactivar usuario"
        >
          <span class="material-symbols-outlined">person_off</span>
        </button>
      </div>
    </article>
    } @empty {
    <div class="empty-state">
      <span class="material-symbols-outlined">group</span>
      <p>No hay usuarios activos.</p>
    </div>
    }
  </div>
</section>
