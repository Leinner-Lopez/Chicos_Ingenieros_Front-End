<section class="categories-view">

  <header class="view-header">
    <div class="header-text">
      <h2 class="header-title">Categorías</h2>
      <p class="header-subtitle">{{ categoriesNumber() }} categorías en catálogo</p>
    </div>
    <button class="btn-primary" (click)="registerCategory()">
      <span class="material-symbols-outlined">add</span>
      Registrar
    </button>
  </header>

  <div class="bento-grid">
    @for (category of categories(); track category.categoryId) {
      <article class="category-card">

        <div class="card-top">
          <div class="icon-wrap">
            <span class="material-symbols-outlined">label</span>
          </div>
          <div class="card-meta">
            <h3 class="category-name">{{ category.name }}</h3>
            <span class="category-id-badge"># {{ category.categoryId }}</span>
          </div>
        </div>

        <div class="card-divider"></div>

        <p class="category-desc">{{ category.description }}</p>

        <div class="card-actions">
          <button class="btn-action btn-edit" (click)="updateCategory(category.categoryId)">
            <span class="material-symbols-outlined">edit</span>
            Editar
          </button>
          <button class="btn-action btn-delete" (click)="deleteCategory(category.categoryId)">
            <span class="material-symbols-outlined">delete</span>
          </button>
        </div>

      </article>
    } @empty {
      <div class="empty-state">
        <span class="material-symbols-outlined">label_off</span>
        <p>No hay categorías registradas aún.</p>
      </div>
    }
  </div>

</section>
