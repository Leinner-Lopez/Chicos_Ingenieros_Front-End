<section class="lots__view">
  <header class="view__header">
    <h2 class="header__title">Lotes</h2>
    <button class="header__button" (click)="registerLot()">
      <span class="material-symbols-outlined"> add </span>
      Registrar
    </button>
  </header>

  <section class="view__cards">
    <ul class="cards__list">
      <li class="list__item">
        <small class="item__title">Totales</small>
        <strong class="item__content">{{ lotsNumber() }}</strong>
      </li>
      <li class="list__item">
        <small class="item__title">Activas</small>
        <strong class="item__content"></strong>
      </li>
      <li class="list__item">
        <small class="item__title">Inactivas</small>
        <strong class="item__content"></strong>
      </li>
      <li class="list__item">
        <small class="item__title">Sin Productos</small>
        <strong class="item__content"></strong>
      </li>
    </ul>
  </section>

  <table class="view__table">
    <thead class="table__title">
      <tr class="title__row">
        <th class="row__title">Nombre</th>
        <th class="row__title">Stock</th>
        <th class="row__title">Fecha de Vencimiento</th>
        <th class="row__title">Acciones</th>
      </tr>
    </thead>
    <tbody class="table__body">
      @for (lot of lots(); track lot.lotId) {
      <tr class="body__row">
        <td class="row__content">{{ lot.productName }}</td>
        <td class="row__content">{{ lot.stockQuantity }}</td>
        <td class="row__content">{{ lot.expirationDate }}</td>
        <td class="row__content row__actions">
          <button class="button edit__button" (click)="updateLot(lot.lotId)">
            <span class="material-symbols-outlined"> edit </span>
          </button>
          <button class="button delete__button" (click)="deleteLot(lot.lotId)">
            <span class="material-symbols-outlined"> delete </span>
          </button>
        </td>
      </tr>

      }
    </tbody>
  </table>
</section>
